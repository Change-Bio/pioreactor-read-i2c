# There are lots of examples of job yaml files at https://github.com/Pioreactor/pioreactorui/tree/master/contrib/jobs
---
display_name: I2C to Voltage # human readable name
job_name: i2c_to_voltage # `job_name` as defined in your Python file
display: true # bool; true to display on the /Pioreactors card
source: pioreactor-i2c-to-voltage # name of your plugin
description: This plugin reads voltages from ADS1015 I2C ADC and exports them to MQTT for access by other jobs # description of what your plugin does
published_settings:
  - key: i2c_bus # as defined in Python
    unit: Bus # unit (ml, lux, AU, etc.)
    label: I2C Bus # human readable name
    description: I2C bus number (typically 1 on Raspberry Pi) # description of your setting
    type: numeric # one of numeric, boolean, string, json
    display: true # bool; true to display on the /Pioreactors card
  - key: i2c_addr # as defined in Python
    unit: Addresses # unit (ml, lux, AU, etc.)
    label: I2C Addresses # human readable name
    description: Comma-separated list of I2C addresses for ADS1015 ADCs (e.g., 0x48,0x4A) # description of your setting
    type: string # one of numeric, boolean, string, json
    display: true # bool; true to display on the /Pioreactors card
  - key: gain_bits # as defined in Python
    unit: Bits # unit (ml, lux, AU, etc.)
    label: Gain Bits # human readable name
    description: PGA gain setting (0=±6.144V, 1=±4.096V, 2=±2.048V, 3=±1.024V, 4=±0.512V, 5=±0.256V) # description of your setting
    type: numeric # one of numeric, boolean, string, json
    display: true # bool; true to display on the /Pioreactors card
  - key: sampling_rate
    unit: Hz
    label: Sampling Rate
    description: ADC sampling frequency in Hz (higher rates better capture noise for filtering)
    type: numeric
    display: true
  - key: publish_rate
    unit: Hz
    label: Publish Rate
    description: How often filtered voltage values are published to MQTT
    type: numeric
    display: true
  - key: moving_avg_window
    unit: Samples
    label: Moving Average Window
    description: Number of samples to average for noise filtering (larger = smoother but more lag)
    type: numeric
    display: true
  - key: enable_filtering
    label: Enable Filtering
    description: Apply moving average filter to reduce noise
    type: boolean
    display: true
  - key: run_diagnostics
    label: Run Diagnostics
    description: Trigger FFT analysis to identify noise sources (results published to MQTT)
    type: boolean
    display: true
